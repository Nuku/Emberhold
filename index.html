<body>
<div id="app">
  <header>
    <div id="title-block">
      <h1>EMBERHOLD</h1>
      <div id="subtitle">a settlement rises from the ash</div>
    </div>
    <div id="status-block">
      <div id="era-line">—</div>
      <div id="time-line">—</div>
      <div id="pop-line">—</div>
      <div id="morale-line">—</div>
      <div id="echo-line" class="hidden"></div>
    </div>
    <div id="controls">
      <div id="updates-control">
        <div id="bonus-timer" class="hidden" role="timer" aria-label="Double-speed time remaining" title="Makeup time: counts down while playing at double speed. Time away adds to the bank, up to 24 hours."></div>
      <button id="btn-updates" class="has-tooltip" data-tooltip="Latest updates (2026-09-08):&#10;Fixed affordable construction, research, and expedition actions starting immediately even when their queue is full; unaffordable actions continue to use the available queue space.&#10;Added drag-and-drop reordering for construction, research, and expedition queues; click still cancels an item.&#10;Added an optional Strict queue order setting that processes construction, research, and expedition queues one item at a time from first to last; the default remains parallel processing.&#10;The front page now keeps the active trial's goal and progress visible, with a direct link to the Trials panel.&#10;Resource-bearing random and lineage events now grant at least their listed reward and can also add 10–20 seconds of the settlement's current production.&#10;Extended the Trial of the Long Night from one year to ten full years (2,000 days).&#10;Fixed controllable buildings loading disabled when their saved toggle was missing; owned buildings now start enabled by default while explicit off settings are preserved.&#10;Updated the Trial of the Long Night so the entire trial remains winter, keeping its food production penalty active throughout the trial.&#10;Updated Power displays to distinguish generator capacity, building allocation, and remaining capacity, including factory allocation in the Stores tooltip.&#10;Fixed expedition production bonuses incorrectly scaling outgoing resource costs; only explicitly defined outgoing modifiers now apply to costs.&#10;Returning to a previously visited landing now grants an Ancestral Blessing: +0.33 Knowledge/s in the new settlement, including when migration begins through a trial.&#10;Industrialization now reduces coal production to 20%, can trigger low-morale coal riots, and has no deadline.&#10;Moved Power allocation controls into a dedicated Power subtab under Construction, keeping the Village panel focused on settlement status and returning to Incomplete when no controllable power buildings remain.&#10;Expanded Power allocation controls to Living Blocks and Factories, with enabled buildings consuming capacity in priority order and factories stopping cleanly when capacity is unavailable.&#10;Offline time now banks up to 24 hours of double-speed play, with a countdown above Updates.&#10;Added a one-hour real-time cooldown when changing governance policies; the cooldown persists through saves and offline progress and resets on migration.&#10;Added Money Lenders to Banking: each supports one Banker and produces 0.001 Currency per population per second.&#10;Added Awaken Ancients research, which lets Quarries, Deep Mines, and Coal Seams use Power for +10% production per powered building.&#10;Added controls and saved state for powering individual dig sites, with Living Blocks receiving priority when capacity is limited.&#10;Exposed live power capacity and dig-site controls through the automation API.&#10;Expanded Shrine descriptions with their low-morale bonus.&#10;Lineage descriptions now show population-growth timing modifiers.&#10;Fixed migrated saves carrying stale Power discovery into settlements without current Power buildings.&#10;Turtlefolk lake memories now grant time-scaled Knowledge and Explorer-based Survey points.&#10;Survey is shown in Stores once Explorers are unlocked.&#10;Renamed Aphrodisiac research to Fertility Rites.&#10;Copper Diggers now scale to the larger of the Miner or Iron Miner capacity.&#10;Added Advanced Science research, the uncapped Instrument Hall, and Experimentalists, who extend Knowledge production beyond Thinkers.&#10;Updated automation to research Advanced Science, build Instrument Halls, and assign Experimentalists as they become available.&#10;Miners are limited to one worker per Stone Works plus one, and Iron Miners to three workers per Deep Store plus three, including loaded settlements and assignment controls.&#10;Thinkers are limited to one worker per Library plus one, including loaded settlements and assignment controls.&#10;Added a stacking morale penalty of −0.01 morale/s for each villager beyond 20.&#10;Added a focusable morale tooltip showing the settlement's current positive and negative morale pressures.&#10;Simplified the weather summary beside the chronicle date while keeping detailed production effects available in tooltips.&#10;Power is now generator capacity instead of a draining resource store: Steam Plants provide 3 capacity each, factories require 1.5 capacity each, and factories shut off when capacity is insufficient.&#10;The next-step card now disappears once no guided milestone remains.&#10;Fixed early-start migrations carrying stale resource-discovery flags from the previous settlement.&#10;Construction, research, and expedition queue entries now list the resources each item needs to finish.&#10;Added three late-game Ancestral Shop upgrades: Far Horizons, Fear of the Conqueror, and Practiced Migrator.&#10;Hidden undiscovered resources from the Stores panel to keep progression information clear and prevent confusion during the Trial of Overflow.&#10;Added multiple simultaneous local trading partners: Explorers reveal a second contact at 1,000 Survey, and the Age of Iron reveals a third; each contributes trade, diplomacy, and alliance benefits.&#10;Updated automation to prioritize Training Yards and Hospitals and respect build availability.&#10;Updated automation to support both action APIs, verify worker assignments, and keep diplomats and guards out of ordinary worker availability calculations (userscript v1.24.0).&#10;Added persistent Military and Economic strength rolls to encountered towns; Military scales attack difficulty, while Economic scales successful loot quantities.&#10;Added late-Iron Spies research and later Espionage research: target-specific spy training reveals Military strength with one spy and two spies reveals Economic strength, while Espionage enables 20-minute attempts to weaken military power.&#10;Added eight attack stages from Raids through Sieges, with escalating costs and difficulty, additional loot rolls, and uncommon loot in the final three stages.&#10;Added post-Siege conquest and Commonality research for conquered realms.&#10;Tuned combat so incoming raids are less destructive and staffed outgoing attacks are more reliable." aria-label="Open the Emberhold changelog">Updates</button>
      </div>
      <button id="btn-pause" aria-pressed="true">Resume</button>
      <button id="btn-save">Save</button>
      <button id="btn-export">Export</button>
