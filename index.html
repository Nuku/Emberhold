<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emberhold — a text incremental</title>
      <link rel="stylesheet" href="style.css?v=publish-20260928u0015">
</head>
<body>
<div id="app">
  <header>
    <div id="title-block">
      <h1>EMBERHOLD</h1>
      <div id="location-line">—</div>
      <div id="subtitle">a settlement rises from the ash</div>
    </div>
    <div id="status-block">
      <div id="era-line">—</div>
      <div id="time-line">—</div>
      <div id="pop-line">—</div>
      <div id="morale-line">—</div>
      <div id="echo-line" class="hidden"></div>
      <div id="wonder-line" class="hidden"></div>
    </div>
    <div id="controls">
      <div id="updates-control">
        <div id="bonus-timer" class="hidden" role="timer" aria-label="Double-speed time remaining" title="Makeup time: counts down while playing at double speed. Time away adds to the bank, up to 24 hours."></div>
<button id="btn-updates" class="has-tooltip" data-tooltip="Latest updates (2026-09-28):&#10;Forges can now be assigned to Iron production for a 15% bonus each; remaining Forges smelt Steel.&#10;Tinkerer recipes now scale output and input use together when storage or ingredients limit production.&#10;Forced Wonder migrations now stay within settled-world landings.&#10;Knowledge storage now holds up to fifty minutes of current production.&#10;When the Worldroot is silenced, the Forager job tooltip now describes tending fields and harvesting crops.&#10;Previously chosen Wonder fates are highlighted and labeled as repeatable.&#10;The Village panel keeps Guards visible when conquered towns use all Barracks capacity and shows occupation reserves.&#10;Periodic panel updates preserve scroll position on long pages such as Settings.&#10;&#10;Wonder calamity losses include a section-scaled surcharge based on current production.&#10;Conquered towns reserve their occupation Guards against Barracks capacity until release or regional unification.&#10;Diplomacy explains how enemy strength affects attacks and loot, with a success-chance forecast for raids.&#10;Solar Array capacity powers buildings correctly, and Power displays include Factory and Aluminum Works consumption.&#10;Aluminum Works power use is included in settlement totals.&#10;Migration clears neighboring towns' siege readiness.&#10;Expedition raid loot is rounded to whole resource units.&#10;&#10;All earlier updates are listed in the Changelog page." aria-label="Open the Emberhold changelog">Updates</button>
      </div>
      <button id="btn-pause" aria-pressed="true">Resume</button>
      <button id="btn-save">Save</button>
      <button id="btn-export">Export</button>
      <button id="btn-import">Import</button>
    </div>
  </header>

  <aside id="stores-panel" aria-labelledby="stores-heading">
    <h2 id="stores-heading" class="section">Stores</h2>
    <div id="stores"></div>
  </aside>

  <nav id="tabs">
    <button data-tab="village" class="tab active">Village</button>
    <button data-tab="build" class="tab">Build</button>
    <button data-tab="research" class="tab">Research</button>
    <button data-tab="diplomacy" class="tab">Diplomacy</button>
    <button data-tab="governance" class="tab">Governance</button>
    <button data-tab="trials" class="tab">Trials</button>
    <button data-tab="expeditions" class="tab">Expeditions</button>
    <button data-tab="wonders" class="tab">Wonders</button>
    <button data-tab="migration" class="tab">Migration</button>
    <button data-tab="stats" class="tab">Stats</button>
    <button data-tab="settings" class="tab">Settings</button>
  </nav>

  <main id="main">
    <section id="panel-village" class="panel"></section>
    <section id="panel-build" class="panel hidden"></section>
    <section id="panel-research" class="panel hidden"></section>
    <section id="panel-diplomacy" class="panel hidden"></section>
    <section id="panel-governance" class="panel hidden"></section>
    <section id="panel-trials" class="panel hidden"></section>
    <section id="panel-expeditions" class="panel hidden"></section>
    <section id="panel-wonders" class="panel hidden"></section>
    <section id="panel-migration" class="panel hidden"></section>
    <section id="panel-stats" class="panel hidden"></section>
    <section id="panel-settings" class="panel hidden"></section>
  </main>

  <aside id="side-panel" aria-label="Queues and message log">
    <section id="queue-panel" aria-labelledby="queue-heading">
      <h2 id="queue-heading">Detailed Queue</h2>
      <div id="queue-build" class="side-queue"></div>
      <div id="queue-research" class="side-queue"></div>
      <div id="queue-expedition" class="side-queue"></div>
    </section>
    <section id="log-panel" aria-labelledby="log-heading">
      <h2 id="log-heading">Message Log <span class="log-tools"><button type="button" data-log-action="clear">Clear</button><button type="button" data-log-action="clear-all">Clear All</button></span></h2>
      <div class="log-filters" role="tablist" aria-label="Message log filters"><button type="button" class="active" data-log-filter="all">All</button><button type="button" data-log-filter="progress">Progress</button><button type="button" data-log-filter="achievements">Achievements</button><button type="button" data-log-filter="queue">Queue</button><button type="button" data-log-filter="building">Building Queue</button><button type="button" data-log-filter="research">Research Queue</button><button type="button" data-log-filter="combat">Combat</button><button type="button" data-log-filter="espionage">Espionage</button><button type="button" data-log-filter="events">Events</button></div>
      <div id="log"></div>
    </section>
  </aside>

  <footer id="banner" class="hidden"></footer>
</div>

<script src="js/data.js?v=publish-20260928u0015"></script>
<script src="js/game.js?v=publish-20260928u0015"></script>
</body>
</html>
