<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emberhold — a text incremental</title>
    <link rel="stylesheet" href="style.css?v=living-block-weather-20260906a">
</head>
<body>
<div id="app">
  <header>
    <div id="title-block">
      <h1>EMBERHOLD</h1>
      <div id="subtitle">a settlement rises from the ash</div>
    </div>
    <div id="status-block">
      <div id="era-line">—</div>
      <div id="time-line">—</div>
      <div id="pop-line">—</div>
      <div id="morale-line">—</div>
      <div id="echo-line" class="hidden"></div>
    </div>
    <div id="controls">
      <button id="btn-updates" class="has-tooltip" data-tooltip="Latest updates (2026-09-06):&#10;Power is now generator capacity instead of a draining resource store: Steam Plants provide 3 capacity each, factories require 1.5 capacity each, and factories shut off when capacity is insufficient.&#10;The next-step card now disappears once no guided milestone remains.&#10;Fixed early-start migrations carrying stale resource-discovery flags from the previous settlement.&#10;Construction, research, and expedition queue entries now list the resources each item needs to finish.&#10;Added three late-game Ancestral Shop upgrades: Far Horizons, Fear of the Conqueror, and Practiced Migrator.&#10;Hidden undiscovered resources from the Stores panel to keep progression information clear and prevent confusion during the Trial of Overflow.&#10;Added multiple simultaneous local trading partners: Explorers reveal a second contact at 1,000 Survey, and the Age of Iron reveals a third; each contributes trade, diplomacy, and alliance benefits.&#10;Updated automation to prioritize Training Yards and Hospitals and respect build availability.&#10;Updated automation to support both action APIs, verify worker assignments, and keep diplomats and guards out of ordinary worker availability calculations (userscript v1.24.0).&#10;Added persistent Military and Economic strength rolls to encountered towns; Military scales attack difficulty, while Economic scales successful loot quantities.&#10;Added late-Iron Spies research and later Espionage research: target-specific spy training reveals Military strength with one spy and Economic strength with two, while Espionage enables 20-minute attempts to weaken military power.&#10;Spy training costs scale with the target town's Economic strength and the number of active spies there; captured spies reduce the surcharge.&#10;Espionage bottoms out at Military strength 60 and stops being offered once that floor is reached.&#10;A spy killed in the field has a 50% chance to betray Emberhold, with the betrayal noted and relations falling by 3–5.&#10;Added eight attack stages from Raids through Sieges, with escalating costs and difficulty, additional loot rolls, and uncommon loot in the final three stages.&#10;Added post-Siege conquest and Commonality research for conquered realms.&#10;Tuned combat so incoming raids are less destructive and staffed outgoing attacks are more reliable." aria-label="Open the Emberhold changelog">Updates</button>
      <button id="btn-save">Save</button>
      <button id="btn-export">Export</button>
      <button id="btn-import">Import</button>
      <button id="btn-reset">Reset</button>
    </div>
  </header>

  <aside id="stores-panel" aria-labelledby="stores-heading">
    <h2 id="stores-heading" class="section">Stores</h2>
    <div id="stores"></div>
  </aside>

  <nav id="tabs">
    <button data-tab="village" class="tab active">Village</button>
    <button data-tab="build" class="tab">Build</button>
    <button data-tab="research" class="tab">Research</button>
    <button data-tab="diplomacy" class="tab">Diplomacy</button>
    <button data-tab="governance" class="tab">Governance</button>
    <button data-tab="trials" class="tab">Trials</button>
    <button data-tab="expeditions" class="tab">Expeditions</button>
    <button data-tab="migration" class="tab">Migration</button>
    <button data-tab="stats" class="tab">Stats</button>
    <button data-tab="settings" class="tab">Settings</button>
  </nav>

  <main id="main">
    <section id="panel-village" class="panel"></section>
    <section id="panel-build" class="panel hidden"></section>
    <section id="panel-research" class="panel hidden"></section>
    <section id="panel-diplomacy" class="panel hidden"></section>
    <section id="panel-governance" class="panel hidden"></section>
    <section id="panel-trials" class="panel hidden"></section>
    <section id="panel-expeditions" class="panel hidden"></section>
    <section id="panel-migration" class="panel hidden"></section>
    <section id="panel-stats" class="panel hidden"></section>
    <section id="panel-settings" class="panel hidden"></section>
  </main>

  <aside id="log-panel">
    <h2>Chronicle</h2>
    <div id="log"></div>
  </aside>

  <footer id="banner" class="hidden"></footer>
</div>

<script src="js/data.js?v=living-block-weather-20260906a"></script>
<script src="js/game.js?v=living-block-weather-20260906a"></script>
</body>
</html>
